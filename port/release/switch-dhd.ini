; Downhill Switch (Downhill Revived on Nintendo Switch, homebrew): settings.
; Put this file beside dhd.nro, in sdmc:/switch/downhill-switch/.
; Lines starting with ; are notes. Remove the ; to turn a setting on.

; Your own Downhill Domination (USA) disc image. Without this line the game looks
; for game.iso beside dhd.nro. The file stays yours; nothing of it is in the .nro.
;iso = sdmc:/switch/downhill-switch/game.iso

; The renderer. "native" draws the game with the GPU and is what the Switch build is for;
; "exact" is not built here yet and shows the movies only.
renderer = native

; Resolution. 1 is the PlayStation 2's own and is what a race holds a playable rate at;
; 2 is twice as sharp and about half the rate, which suits the menus more than a race.
scale = 1

; CPU, GPU and memory clocks. Horizon starts a homebrew at the handheld defaults, which
; leave the game far short; these are the rates Horizon itself uses for its boost modes.
;   on   CPU 1785, GPU 768, EMC 1600 MHz (the default)
;   max  CPU 1785, GPU 921.6, EMC 1600 MHz -- faster, hotter, shorter battery
;   off  leave every clock alone. Use this if sys-clk manages this title, so the two
;        do not write over each other.
DHD_SWITCH_CLOCKS = on

; Skip the opening movies.
;skip_movies = 1

; 4:3 is the original shape. "wide" and "16:9" fill more of the screen.
;DHD_ASPECT = 4:3

; Controller icons: auto, playstation, xbox or nintendo.
;prompts = auto

; Sharp or original menu font.
;font = sharp

; Rumble.
;vibration = 1

; --- for looking into a problem ---------------------------------------------------
; A line every five seconds with the render thread's time by phase.
;DHD_GL_TIMES = 1
; A line a second with the sound queue, underruns and silence.
;DHD_SND_HOST_TRACE = 1
; Leave the game's threads where Horizon puts them (the default) or pin them: on.
;DHD_SWITCH_CORES = off
